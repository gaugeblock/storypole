[workspace]
resolver = "3"
members = [
    ".",
    "crates/*",
]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
authors = ["Colin Wolff <1562545+colinwolff@users.noreply.github.com>"]
license = "Apache-2.0"
repository = "https://github.com/gaugeblock/storypole"
homepage = "https://gaugeblock.dev"
readme = "README.md"
keywords = ["ast", "neurosymbolic", "codegen", "llm", "compiler"]
categories = ["development-tools", "compilers", "command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package]
name = "storypole"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Git-native SQLite and JSONL backlog, task DAG, and MCP memory store for AI coding agents."

[dependencies]
storypole-core = { path = "crates/storypole-core", version = "0.1.0-beta.1" }

[lints]
workspace = true

[profile.dev]
opt-level = 0
debug = 1

[profile.test]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.test.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
